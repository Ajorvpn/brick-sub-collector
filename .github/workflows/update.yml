name: Update subscriptions

on:
  push:
    branches: [main, 'test/**']
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: subscription-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install sing-box v1.14.4
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo install -m 0755 /tmp/sing-box-1.14.4-linux-amd64/sing-box /usr/local/bin/sing-box
          rm -rf /tmp/sing-box.tar.gz /tmp/sing-box-1.14.4-linux-amd64
          sing-box version
      - name: Collect and test subscriptions
        env:
          GITHUB_ACTIONS: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRICK_SUB_AES_KEY: ${{ secrets.BRICK_SUB_AES_KEY }}
          IPDATA_API_KEY: ${{ secrets.IPDATA_API_KEY }}
        run: python collector.py
      - name: Publish generated files to the subscription branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -d "output" ]; then
            echo "No output directory found. Skipping push."
            exit 0
          fi
          PUBLISH_DIR=/tmp/sub-publish
          rm -rf "$PUBLISH_DIR"
          mkdir -p "$PUBLISH_DIR"
          # Only the generated subscription files ever reach the sub branch:
          # source files, tests, workflows and caches stay out of the temp repo.
          cp -a output/. "$PUBLISH_DIR"/
          # Encrypted subscription (exists only when BRICK_SUB_AES_KEY is set).
          if [ -f output/sub_enc.txt ]; then
            cp output/sub_enc.txt "$PUBLISH_DIR"/sub_enc.txt
          fi
          if [ -f output/candidates.txt ]; then
            cp output/candidates.txt "$PUBLISH_DIR"/candidates.txt
          fi
          # Xray 26+ FinalMask (fm=) mirrors for v2rayN / v2rayNG.
          for frag in servers_xray_frag.txt sub_xray_frag.txt; do
            if [ -f "output/$frag" ]; then
              cp "output/$frag" "$PUBLISH_DIR/$frag"
            fi
          done
          cd "$PUBLISH_DIR"
          git init -q -b sub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Operator scoped subscriptions (operators/) ship with the rest.
          git add -A operators 2>/dev/null || true
          git add -A candidates.txt 2>/dev/null || true
          git add -A sub_enc.txt 2>/dev/null || true
          # Xray FinalMask mirrors ship alongside the plain subscription.
          git add -A servers_xray_frag.txt sub_xray_frag.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No generated changes to publish."
            exit 0
          fi
          git commit -q -m "Update generated subscriptions"
          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force "$REMOTE_URL" HEAD:refs/heads/sub
