name: Update subscriptions

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: subscription-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect and test subscriptions
        env:
          GITHUB_ACTIONS: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collector.py
      - name: Publish generated files to the subscription branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -d "output" ]; then
            echo "No output directory found. Skipping push."
            exit 0
          fi
          PUBLISH_DIR=/tmp/sub-publish
          rm -rf "$PUBLISH_DIR"
          mkdir -p "$PUBLISH_DIR"
          # Only the generated subscription files ever reach the sub branch:
          # source files, tests, workflows and caches stay out of the temp repo.
          cp -a output/. "$PUBLISH_DIR"/
          cd "$PUBLISH_DIR"
          git init -q -b sub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to publish."
            exit 0
          fi
          git commit -q -m "Update generated subscriptions"
          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force "$REMOTE_URL" HEAD:refs/heads/sub
