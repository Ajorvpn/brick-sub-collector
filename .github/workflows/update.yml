name: Update subscriptions

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: subscription-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect and test subscriptions
        env:
          GITHUB_ACTIONS: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collector.py
      - name: Publish generated files to the subscription branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan sub-temp
          git rm -rf --cached .
          if [ -d "output" ]; then
            cp -r output/* .
            rm -rf output/
            git add .
            git commit -m "Update generated subscriptions"
            git push --force origin HEAD:sub
          else
            echo "No output directory found. Skipping push."
          fi
